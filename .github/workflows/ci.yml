name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ./science ./backend "backend[dev]"

      - name: Lint with Ruff
        run: |
          ruff check backend/app/core/ tests/unit/test_production_config_and_rate_limit.py

      - name: Run Unit Tests
        run: |
          pytest tests/unit/test_production_config_and_rate_limit.py tests/unit/test_contracts.py tests/unit/test_scaffold.py

  frontend:
    name: Frontend Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Run Vitest Unit Tests
        run: npm run test

      - name: Build Production Bundle
        run: npm run build

  docker-compose-check:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Local Docker Compose
        run: docker compose config -q

      - name: Validate Production Docker Compose
        env:
          SECRET_KEY: ci-test-secret-key-32-chars-long
          POSTGRES_PASSWORD: ci-postgres-password
        run: docker compose -f docker-compose.prod.yml config -q
