[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sphx-backend"
version = "0.1.0"
description = "FastAPI gateway, Celery workers, and archive providers for the SPHEREx platform."
requires-python = ">=3.11"
dependencies = [
    "sphx-core>=0.1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "celery>=5.4",
    "redis>=5.0",
    "boto3>=1.34",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.entry-points."sphx.providers"]
spherex_irsa = "app.providers.spherex_irsa:SpherexIrsaProvider"
gaia = "app.providers.gaia:GaiaProvider"
wise = "app.providers.wise:WiseProvider"
simbad = "app.providers.simbad:SimbadProvider"
horizons = "app.providers.horizons:HorizonsProvider"
mpc = "app.providers.mpc:MpcProvider"

[tool.setuptools.packages.find]
include = ["app*"]
