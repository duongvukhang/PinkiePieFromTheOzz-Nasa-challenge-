[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sphx-core"
version = "0.1.0"
description = "Pure Python astrometric, photometric, and trajectory science library for SPHEREx."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "astropy>=6.0",
    "astropy-healpix>=1.0",
    "photutils>=1.12",
    "sep>=1.2",
    "reproject>=0.13",
    "astroquery>=0.4.7",
    "pyvo>=1.5",
    "scikit-learn>=1.4",
    "emcee>=3.1",
]

[tool.setuptools.packages.find]
include = ["sphx_core*"]
